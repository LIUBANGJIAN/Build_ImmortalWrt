name: Build ImmortalWrt 25.12 (Ultimate x86)

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TAG_NAME: "v25.12-Ultimate"
  TZ: "Asia/Shanghai"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 设置北京时间时区
      run: |
        sudo timedatectl set-timezone "Asia/Shanghai"
        echo "BUILD_TIME=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: 深度清理云端空间与安装依赖
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y libfuse-dev libncurses5-dev libncursesw5-dev ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd zlib1g-dev scdoc
        sudo -E apt-get -qq clean

    - name: 克隆 ImmortalWrt 25.12 稳定版源码
      run: |
        git clone -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: 运行 diy-part1.sh 注入第三方软件源 (Feeds)
      working-directory: ./openwrt
      run: |
        [ -e $GITHUB_WORKSPACE/scripts/diy-part1.sh ] && chmod +x $GITHUB_WORKSPACE/scripts/diy-part1.sh && $GITHUB_WORKSPACE/scripts/diy-part1.sh
        ./scripts/feeds update -a 
        ./scripts/feeds install -a

    - name: 运行 diy-part2.sh 加载底层修改与北京大学镜像源
      run: |
        [ -e $GITHUB_WORKSPACE/scripts/diy-part2.sh ] && chmod +x $GITHUB_WORKSPACE/scripts/diy-part2.sh && $GITHUB_WORKSPACE/scripts/diy-part2.sh

    - name: 加载机型配置文件 (.config)
      run: |
        CONFIG_FILE="configs/${{ matrix.target }}.config"
        if [ -f "$CONFIG_FILE" ]; then
          cp "$CONFIG_FILE" openwrt/.config
        else
          echo "错误: 找不到对应的配置文件 $CONFIG_FILE"
          exit 1
        fi
        cd openwrt && make defconfig

    - name: 预下载编译依赖包
      working-directory: ./openwrt
      run: |
        make download -j8

    - name: 开始编译固件 (${{ matrix.target }})
      working-directory: ./openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: 重命名固件文件（自动带上北京时间戳）
      id: organize
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        mkdir -p packaging_files
        for file in *combined*efi*; do
          if [ -f "$file" ]; then
            ext="${file##*.}"
            cp "$file" "packaging_files/immortalwrt-25.12-${{ matrix.target }}-${{ env.BUILD_TIME }}.$ext"
          fi
        done
        echo "status=success" >> $GITHUB_ENV

    - name: 1. 上传固件到 GitHub Actions Artifacts 产物
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success'
      with:
        name: ImmortalWrt-${{ matrix.target }}-${{ env.BUILD_TIME }}
        path: openwrt/bin/targets/*/*/*packaging_files*/*

    - name: 2. 自动发布固件到 GitHub Releases 页面
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "ImmortalWrt 25.12 稳定版 [${{ env.BUILD_TIME }}]"
        files: openwrt/bin/targets/*/*/*packaging_files*/*
        body: |
          ## 🚀 固件更新说明
          - **编译时间（北京时间）**: ${{ env.BUILD_TIME }}
          - **目标架构**: x86_64
          - **状态**: 编译成功，开箱即用！
